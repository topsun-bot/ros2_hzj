# evals/promptfooconfig.yaml
#
# 《5》Promptfoo evaluation suite for ros2_hzj.
#
# This repo is a ROS 2 / DDS middleware workspace, not an LLM app. There is
# no prompt on the DDS wire, so we map "assertions about DDS behavior" onto
# promptfoo's custom-provider abstraction:
#
#   * provider  : local-script (evals/localScriptProvider.mjs) runs a
#                 scripts/check_*.py (or prove_rmw.py / print_bench_gates.py)
#                 with python3 and returns its stdout as `output`.
#   * prompt    : the path to the gate script (rendered from {{script}}).
#   * assertion : `contains` the script's own "healthy" stdout marker.
#                 A non-zero exit code is already a provider `error`, so the
#                 case fails even without an explicit exit-code assertion.
#
# Hold boundary: this suite only *runs* the existing read-only gate scripts.
# It does not edit config/fastdds.xml, docs/artifacts/bench/SCOREBOARD.md,
# any vendor tree, or dimos_bridge runtime code.

description: >
  《5》Promptfoo seed evals for ros2_hzj gate scripts. Each case runs one
  scripts/*.py as a local-script provider and asserts its stdout marker.

prompts:
  - '{{script}}'

providers:
  # Path is resolved relative to this config file's directory (evals/).
  - id: './localScriptProvider.mjs'

tests:
  - description: 'prove_rmw.py: env/string identity gate exits 0 with ROS unset'
    vars:
      script: scripts/prove_rmw.py
    assert:
      - type: contains
        value: 'ROS not loaded'

  - description: 'check_source_map.py: source map healthy; allowlisted DDS/RMW symbols must still resolve in vendor sources'
    vars:
      script: scripts/check_source_map.py
    assert:
      - type: contains
        value: 'Source map healthy'
      - type: contains
        # Locks the symbol allowlist check (rmw_publish/take, dds_take, WaitSet,
        # ...): a vendor rewrite/drop that removes a traced API fails the eval.
        value: 'allowlisted symbols ok:'

  - description: 'print_bench_gates.py: bench gates healthy; cross-host blocked, no fabricated latency numbers / P99 summing'
    vars:
      script: scripts/print_bench_gates.py
    assert:
      - type: contains
        value: 'Bench gates healthy'
      - type: contains
        # Cross-host latency is blocked on this host; must not be flipped to a pass.
        value: 'cross-host: blocked'
      - type: contains
        # Methodology honesty: segment P99s must never be summed into a chain P99.
        value: 'Do not sum segment P99s'

  - description: 'check_risk_matrix.py: risk matrix healthy; §9.4 layer order, no invented risk scores, cross-host blocked'
    vars:
      script: scripts/check_risk_matrix.py
    assert:
      - type: contains
        value: 'Risk matrix healthy'
      - type: contains
        # §9.4 layer checklist anchor: env/XML is the first layer.
        value: '§9.4: env/XML first'
      - type: contains
        # Honesty: this record carries no made-up risk percentages.
        value: 'Do not invent risk percentages'
      - type: contains
        # Cross-host evidence stays blocked (single-line phrase).
        value: 'Cross-host stays blocked'

  - description: 'check_executor_map.py: executor WaitSet->callback map healthy'
    vars:
      script: scripts/check_executor_map.py
    assert:
      - type: contains
        value: 'Executor map healthy'
      - type: contains
        value: 'WaitSet -> callback: mapped'

  - description: 'check_runtime_provenance.py: underlay vs vendor snapshot healthy'
    vars:
      script: scripts/check_runtime_provenance.py
    assert:
      - type: contains
        value: 'Runtime provenance healthy'
      - type: contains
        value: 'underlay != vendor snapshot'

  - description: 'check_unitree_cyclone_swap.py: Unitree 0.10.2 vs vendor 11.0.1 record healthy; drop-in FAIL / wire UNPROVEN verdict must not be silently flipped'
    vars:
      script: scripts/check_unitree_cyclone_swap.py
    assert:
      - type: contains
        value: 'Unitree Cyclone swap record healthy'
      - type: contains
        value: 'drop-in: FAIL / wire: UNPROVEN'

  - description: 'check_three_chain_repro.py: three-chain map != reproduce, STATUS blocked (must not fabricate a reproduce PASS without a Humble host)'
    vars:
      script: scripts/check_three_chain_repro.py
    assert:
      - type: contains
        value: 'Three-chain reproduce record healthy'
      - type: contains
        value: 'map ≠ reproduce'
      - type: contains
        value: 'STATUS: blocked'

  - description: 'check_sink_layers.py: sink layers mapped Hold vs allowed'
    vars:
      script: scripts/check_sink_layers.py
    assert:
      - type: contains
        value: 'Sink-layer record healthy'
      - type: contains
        value: 'sink layers: mapped (Hold vs allowed)'

  - description: 'check_dual_chain_baseline.py: dual-chain baseline pointer-only, no XML rewrite; same-topology XML tuning paused'
    vars:
      script: scripts/check_dual_chain_baseline.py
    assert:
      - type: contains
        value: 'Dual-chain baseline healthy'
      - type: contains
        value: 'dual-chain baseline: pointer only (no XML rewrite)'
      - type: contains
        value: 'same-topology XML tuning is paused'

  - description: 'check_dual_chain_baseline.py: load.py is single source of truth, cross-checks shell copies + wrapper'
    vars:
      script: scripts/check_dual_chain_baseline.py
    assert:
      - type: contains
        # One line encodes the real chain values: A=rmw_fastrtps_cpp/42 +
        # fastdds.xml, B=rmw_cyclonedds_cpp/0, CYCLONEDDS_URI in CHAIN_B_UNSET.
        value: 'ok env truth:'
      - type: contains
        value: 'rmw_fastrtps_cpp/42'
      - type: contains
        value: 'rmw_cyclonedds_cpp/0'
      - type: contains
        value: 'CYCLONEDDS_URI in CHAIN_B_UNSET'
      - type: contains
        value: 'chain_a.sh exports match load.py CHAIN_A'
      - type: contains
        value: 'chain_b.sh exports match load.py CHAIN_B'
      - type: contains
        value: 'dual_chain_env.py re-exports match load.py'
      - type: contains
        value: 'import leaves os.environ unchanged'

  - description: 'check_dod_evidence.py: product DoD unmet, STATUS blocked (must not claim the product DoD is met)'
    vars:
      script: scripts/check_dod_evidence.py
    assert:
      - type: contains
        value: 'Product DoD evidence healthy'
      - type: contains
        value: 'DoD: unmet'

  - description: 'check_cega_bridge_hold.py: Cega / Bridge Hold (no Cega integration, no runtime edits)'
    vars:
      script: scripts/check_cega_bridge_hold.py
    assert:
      - type: contains
        value: 'Cega / Bridge Hold healthy'
      - type: contains
        value: 'no Cega'

  - description: 'check_frozen_path_literals.py: no second Path(...) copy of frozen Hold paths'
    vars:
      script: scripts/check_frozen_path_literals.py
    assert:
      - type: contains
        value: 'Frozen-path literals healthy'

  # Direct executable source of truth for the dual-chain contract. These two
  # cases pass CLI args through the local-script provider (argv split).
  - description: 'load.py print-a: Chain A is rmw_fastrtps_cpp / ROS_DOMAIN_ID 42 / config/fastdds.xml'
    vars:
      script: config/env/load.py print-a
    assert:
      - type: contains
        value: 'RMW_IMPLEMENTATION=rmw_fastrtps_cpp'
      - type: contains
        value: 'ROS_DOMAIN_ID=42'
      - type: contains
        value: 'config/fastdds.xml'

  - description: 'load.py print-b: Chain B is rmw_cyclonedds_cpp / ROS_DOMAIN_ID 0'
    vars:
      script: config/env/load.py print-b
    assert:
      - type: contains
        value: 'RMW_IMPLEMENTATION=rmw_cyclonedds_cpp'
      - type: contains
        value: 'ROS_DOMAIN_ID=0'

  # Full-stdout fingerprint regression (eval-only, not a CI gate): re-runs all
  # 13 gates + load.py print-a|b and compares normalized stdout byte-for-byte
  # against committed evals/fixtures/. Catches unintended output drift that
  # exit-code + single-marker checks cannot see. Regenerate reviewed changes
  # with `python3 evals/fingerprint_check.py --update`.
  - description: 'fingerprint_check.py: every gate/load.py stdout matches the committed, normalized baseline'
    vars:
      script: evals/fingerprint_check.py
    assert:
      - type: contains
        value: 'stdout fingerprint: stable'
      - type: contains
        # Locks the covered command count so dropping a command fails the eval.
        value: '**commands:** 15'

  # Negative self-test for the frozen-path-literal guard (eval-only, not a CI
  # gate). The positive #14 run only proves the current tree is clean; it cannot
  # prove the detector still fires. This case builds tempdir fixtures and asserts
  # the guard flags every forbidden Path(...) form, stays silent on allowed
  # mentions, exempts the single-source helper, and render() returns the right
  # exit code. A regex that is widened to never match fails this case.
  - description: 'frozen_guard_selftest.py: the frozen-path guard actually fires on violations (negative regression, tempdir-only)'
    vars:
      script: evals/frozen_guard_selftest.py
    assert:
      - type: contains
        value: 'frozen guard selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '6 must-flag, 7 non-flag, 2 render cases'

  # Negative self-test for the dual-chain env cross-check guard (eval-only, not
  # a CI gate). The positive #11 run only proves the current env is healthy; it
  # cannot prove the four cross-checks still fire. This case builds a minimal
  # load.py / chain_*.sh / wrapper tree in a tempdir and asserts the guard
  # catches domain drift in either chain, shell/load.py cross-check drift,
  # wrapper re-export drift, import-time os.environ mutation, and chain_b.sh
  # exporting / failing to unset CYCLONEDDS_URI; stays silent on a healthy tree
  # and on the real repo; and a widened detector fails this case.
  - description: 'dual_chain_env_guard_selftest.py: the env cross-checks actually fire on drift (negative regression, tempdir-only)'
    vars:
      script: evals/dual_chain_env_guard_selftest.py
    assert:
      - type: contains
        value: 'dual-chain env guard selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '6 negative, 2 healthy, 1 mutation'

  # Negative self-test for the Unitree Cyclone-swap honesty guard (eval-only,
  # not a CI gate). The positive #7 run only proves the current record prints
  # the marker; it cannot prove the checks still fire. This case copies the
  # five real files into a tempdir and asserts the guard catches a flipped
  # drop-in/wire verdict, a tampered quoted DDS_VERSION 0.10.2, a changed
  # vendored Cyclone SHA / CMake project() VERSION pin, and a deleted swap
  # doc; stays green on a healthy copied tree and the real repo; and a CMake
  # regex widened to drop the VERSION pin demonstrably silences the check.
  - description: 'unitree_swap_guard_selftest.py: the Unitree swap honesty verdict actually fires on tampering (negative regression, tempdir-only)'
    vars:
      script: evals/unitree_swap_guard_selftest.py
    assert:
      - type: contains
        value: 'unitree swap guard selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '5 negative, 2 healthy, 1 mutation'

  # Negative self-test for the ros2-source-map honesty guard (eval-only, not a
  # CI gate). The positive #2 run only proves the current map renders healthy;
  # it cannot prove the checks still fire. This case builds minimal temp trees
  # and asserts the guard catches a deleted map, an empty (path-less) map, a
  # cited path missing on disk, and a removed allowlisted symbol; that a stale
  # cited line number still warns only (exit 0) while the symbol exists; that
  # the real repo and a minimal healthy tree stay green; and that an
  # always-hit symbol lookup demonstrably silences the symbol FAIL.
  - description: 'source_map_guard_selftest.py: the source-map checks actually fire on tampering (negative regression, tempdir-only)'
    vars:
      script: evals/source_map_guard_selftest.py
    assert:
      - type: contains
        value: 'source map guard selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '4 negative, 1 warn-only, 2 healthy, 1 mutation'

  # Negative self-test for the Executor/WaitSet map guard (eval-only, not a
  # CI gate). Covers only the executor-unique branches the #21 source-map
  # self-test does not share: a Humble rcl/rclcpp/rclpy tree appearing under
  # vendor/ (FAIL vendored), missing identity markers / Feishu URLs, an
  # allowlisted file no longer cited, and a required doc missing; plus the
  # two executor-only parse_map parameters (absent_keys filters absent-tree
  # citations, reject_bare_words rejects prose words). The real repo and a
  # minimal healthy tree stay green; emptying ABSENT_VENDOR_TREES
  # demonstrably silences the vendored-tree check.
  - description: 'executor_map_guard_selftest.py: the executor-map checks actually fire on tampering (negative regression, tempdir-only)'
    vars:
      script: evals/executor_map_guard_selftest.py
    assert:
      - type: contains
        value: 'executor map guard selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '5 negative, 2 parse-guard, 2 healthy, 1 mutation'

  # Negative self-test for the product-DoD honesty guard (eval-only, not a
  # CI gate). Covers its unique anti-fabrication logic: a fabricated positive
  # STATUS: PASS / DoD: met / this-host measured-delta / "Humble ran here"
  # claim and an invented booked p99 token must FAIL; a same-line prohibition
  # ("do not write STATUS: PASS") and the policy word 分位数 must stay green
  # (bidirectional anti-false-positive contract); the real repo and a copied
  # healthy tree stay green; neutering the STATUS fabrication regex
  # demonstrably silences the check. Plain missing-marker/missing-file cases
  # are intentionally not duplicated (same shape as #20 N5 / #22 N2·N5).
  - description: 'dod_evidence_guard_selftest.py: the DoD anti-fabrication checks actually fire (negative regression, tempdir-only)'
    vars:
      script: evals/dod_evidence_guard_selftest.py
    assert:
      - type: contains
        value: 'dod evidence guard selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '5 negative, 2 non-flag, 2 healthy, 1 mutation'

  # Negative self-test for the Cega / Bridge Hold guard (eval-only, not a
  # CI gate). Covers its unique parsers, not the generic STATUS:-PASS mechanism
  # already pinned by #23: the ADR §13(4) table cell must start with **Hold**
  # and contain no PASS/已接 Cega/integrate Cega (a flipped cell, a Hold cell
  # smuggling a bare PASS, or a deleted row must FAIL ADR row); the guard's
  # own in-memory row self-check must reject both disguises; the Chinese-only
  # 已接 Cega fabrication pattern and the first-Status:-line check must fire;
  # a same-line prohibition stays exempt in either doc; and neutering the
  # 已接 Cega regex demonstrably silences the check.
  - description: 'cega_bridge_hold_guard_selftest.py: the Cega/Bridge Hold checks actually fire on tampering (negative regression, tempdir-only)'
    vars:
      script: evals/cega_bridge_hold_guard_selftest.py
    assert:
      - type: contains
        value: 'cega bridge hold guard selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '5 negative, 2 non-flag, 1 builtin self-check, 2 healthy, 1 mutation'

  # Negative self-test for the runtime-provenance guard (eval-only, not a
  # CI gate). Covers its two unique parsers, not the plain marker-substring
  # checks: _dockerfile_pins_humble must catch a rolling pin, a missing
  # ENV ROS_DISTRO directive, and a present-but-valueless ENV (three distinct
  # branches), and _versions_rows must require the vendored-tree name and a
  # 40-hex SHA on the SAME table row (a stripped SHA or a SHA moved to another
  # line must FAIL VERSIONS rows); widening the SHA regex to any word
  # demonstrably silences the row check.
  - description: 'runtime_provenance_guard_selftest.py: the Humble-pin and VERSIONS-SHA-row checks actually fire on tampering (negative regression, tempdir-only)'
    vars:
      script: evals/runtime_provenance_guard_selftest.py
    assert:
      - type: contains
        value: 'runtime provenance guard selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '5 negative, 2 healthy, 1 mutation'

  # Negative self-test for the sink-layers guard (eval-only, not a CI gate).
  # Covers its one unique parser, _LAYER_ROW_RE, not the plain marker
  # substrings (positive #10) or the absent-vendor-tree mechanism (#22). The
  # line-anchored bold-label match must not degrade to a bare-word scan: the
  # app row body literally contains rclpy and the prose is full of DDS, so
  # blanking the | **rcl** | / | **DDS** | row label while keeping the row body
  # must FAIL layers with no collateral FAIL markers/policy; widening the
  # regex to bare words demonstrably silences the missing-rcl-row check.
  - description: 'sink_layers_guard_selftest.py: the six-layer table-row anchor actually fires on a blanked label (negative regression, tempdir-only)'
    vars:
      script: evals/sink_layers_guard_selftest.py
    assert:
      - type: contains
        value: 'sink layers guard selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '2 negative, 2 healthy, 1 mutation'

  # Negative self-test for the three-chain-reproduce guard (eval-only, not a
  # CI gate). Covers the two _FABRICATE_RES patterns unique to that record: an
  # extra contradictory `map = reproduce` and a `three-chain repro: PROVEN`
  # appended while map != reproduce / STATUS: blocked and all chain markers
  # stay present (so phrase/status existence checks pass and only the
  # fabricate regex can catch it). The same STATUS-fabricate family on the DoD
  # and Cega docs is already pinned by #23/#24, and the marker-co-occurrence
  # chain check is the guard's stated marker-only boundary. A same-line
  # prohibition stays exempt; neutralising the map=reproduce regex silences N1.
  - description: 'three_chain_repro_guard_selftest.py: the map=reproduce / repro-PROVEN fabricate regexes actually fire on an extra contradictory sentence (negative regression, tempdir-only)'
    vars:
      script: evals/three_chain_repro_guard_selftest.py
    assert:
      - type: contains
        value: 'three-chain repro guard selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '2 negative, 1 non-flag, 2 healthy, 1 mutation'

  # #28 bench-gates guard negative self-test: the positive bench-gates case
  # (#3) and #17 fingerprint only prove the healthy tree renders green; they
  # cannot prove print_bench_gates.py's two unique checks fire — the cross-host
  # placeholder directory must exist while UDP is blocked (delete it ->
  # FAIL missing) and _cross_host_hits must find an honest STATUS: blocked via
  # _STATUS_BLOCKED_RE in at least one of five candidates (reword all ->
  # FAIL cross-host; a bare STATUS token must not count). A single BLOCKED.txt
  # hit is sufficient (any-hit); widening the regex to bare STATUS silences N2.
  # The plain required-file/marker substring loop is the same shape covered by
  # #23 and others and is not duplicated here.
  - description: 'bench_gates_guard_selftest.py: the cross-host directory-existence and STATUS-blocked regex checks actually fire on tampering (negative regression, tempdir-only)'
    vars:
      script: evals/bench_gates_guard_selftest.py
    assert:
      - type: contains
        value: 'bench gates guard selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '2 negative, 1 non-flag, 2 healthy, 1 mutation'

  # #29 gate-runner registry consistency self-test: running run_all_gates
  # green only proves the 13 *registered* scripts exist and print markers; it
  # cannot detect an orphan gate (a new scripts/check_*.py, or one of the two
  # fixed-name gates, left out of GATES -> the headline stays "13/13") nor pin
  # the rule that excludes underscore helpers and run_all_gates.py itself. This
  # case locks bidirectional disk<->GATES equality and the 13-gate count. The
  # separate CI structure-job 12-vs-13 wiring gap is out of scope (ci.yml needs
  # the workflow token scope) and is intentionally not asserted here.
  - description: 'gate_registry_selftest.py: every gate-shape script under scripts/ is registered in run_all_gates.GATES and vice versa (no orphan/missing; underscore helpers and the runner excluded), tempdir-only'
    vars:
      script: evals/gate_registry_selftest.py
    assert:
      - type: contains
        value: 'gate registry selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '2 negative, 1 non-flag, 2 healthy, 1 mutation'

  # #30 gate-runner execution-semantics self-test: #29 pins the registry
  # (disk<->GATES equality) but never executes a gate, so it cannot protect the
  # run_one/main verdict logic -- a gate that exits 0 without printing its
  # healthy marker must still FAIL (zero-but-missing-marker), a non-zero exit or
  # a missing script (127) must FAIL, and a marker on stderr must still count
  # (stdout+stderr combined). A run_one stub that always claims the marker is
  # present must hide a hollowed-out exit-0 gate (mutation, then re-caught).
  - description: 'gate_execution_selftest.py: run_all_gates passes a temp gate only when it exits 0 AND prints its marker over stdout/stderr combined; exit-0-without-marker, non-zero exit, and a missing script (127) each FAIL the run; a marker-blind run_one leaks the no-marker gate, tempdir-only'
    vars:
      script: evals/gate_execution_selftest.py
    assert:
      - type: contains
        value: 'gate runner execution selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '3 negative, 1 non-flag, 1 healthy, 1 mutation'

  # #31 fingerprint strict-layer self-test: case #17 only asserts the healthy
  # "stdout fingerprint: stable" path, so it cannot prove the byte-for-byte
  # checker actually fails when it must. Pins live!=fixture drift, a missing
  # fixture, and a non-zero command as FAIL (rc 1), --update refusing a failing
  # command without writing its fixture, the <REPO_ROOT> normalization that
  # prevents false DRIFT, and a normalize stub that always returns the baseline
  # hiding drift (mutation, then re-caught).
  - description: 'fingerprint_guard_selftest.py: the strict stdout fingerprint checker must FAIL on live!=fixture drift, a missing fixture, and a non-zero command, must refuse --update for a failing command without writing a fixture, and must normalize the absolute repo root to <REPO_ROOT> so a clone path never drifts; a normalize stub that always returns the baseline hides drift, tempdir-only'
    vars:
      script: evals/fingerprint_guard_selftest.py
    assert:
      - type: contains
        value: 'fingerprint guard selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '4 negative, 1 non-flag, 1 healthy, 1 mutation'

  # #32 dual-chain env source-of-truth self-test: case #19 only proves the env
  # guard detects tampered shell fixtures; it never pins load.py itself. Pins
  # describe() values + unknown-chain ValueError, the six CLI subcommands
  # (unknown -> exit 2), Chain B apply() popping CYCLONEDDS_URI, POSIX-shell
  # quote escaping that round-trips a quoted value, import purity (no
  # os.environ mutation), and an apply stub that skips the unset pop and leaks
  # the URI (mutation, then re-caught).
  - description: 'dual_chain_env_load_selftest.py: config/env/load.py must return the exact Chain A/B contract, raise ValueError on an unknown chain, reject an unknown CLI subcommand with exit 2, unset CYCLONEDDS_URI on Chain B apply, emit POSIX-shell-safe exports that round-trip a quoted value, and leave os.environ unchanged on import; an apply that skips the unset pop leaks the URI, subprocess/snapshot-only'
    vars:
      script: evals/dual_chain_env_load_selftest.py
    assert:
      - type: contains
        value: 'dual-chain env load selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '3 negative, 2 non-flag, 1 healthy, 1 mutation'

  # #33 local-script provider self-test: every eval case (#12-#32) depends on
  # the Node provider turning a non-zero exit into a promptfoo `error`. Pins
  # empty/whitespace prompt -> empty-prompt error, exit 1 -> "exited with code
  # 1" carrying stdout+stderr, missing script (python3 exit 2) -> "exited with
  # code 2", success output = stdout only (no stderr leak into contains/
  # fingerprint input), argv whitespace split + cwd=repoRoot, and a blind
  # provider that swallows non-zero exits (mutation, distinguished from the
  # real one). A python harness shells out to a tempdir Node harness that
  # imports the real .mjs provider; no in-tree fixtures, repo untouched.
  - description: 'local_script_provider_selftest.py: the local-script promptfoo provider must id as local-script, error on an empty or whitespace-only prompt, propagate exit 1 as an error with stdout+stderr and a missing script as code 2, return stdout-only output on success, and split argv with cwd=repoRoot; a blind provider that swallows non-zero exits must be distinguishable, tempdir node harness only'
    vars:
      script: evals/local_script_provider_selftest.py
    assert:
      - type: contains
        value: 'local-script provider selftest: PASS'
      - type: contains
        # Locks the fixture counts so weakening/removing a negative case fails.
        value: '3 negative, 2 non-flag, 1 healthy, 1 mutation'

  # #34 dual-chain env thin wrapper self-test: dimos_bridge/dual_chain_env.py
  # only re-exports config/env/load.py via importlib. Pins CHAIN_A/CHAIN_B being
  # the SAME objects as the loaded source (re-export not copy), describe
  # delegation + fresh dicts, _ENV_PY path + __all__, import purity (no
  # os.environ change), apply_chain_b forwarding unset so a preset
