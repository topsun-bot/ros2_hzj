# evals/promptfooconfig.yaml
#
# 《5》Promptfoo evaluation suite for ros2_hzj.
#
# This repo is a ROS 2 / DDS middleware workspace, not an LLM app. There is
# no prompt on the DDS wire, so we map "assertions about DDS behavior" onto
# promptfoo's custom-provider abstraction:
#
#   * provider  : local-script (evals/localScriptProvider.mjs) runs a
#                 scripts/check_*.py (or prove_rmw.py / print_bench_gates.py)
#                 with python3 and returns its stdout as `output`.
#   * prompt    : the path to the gate script (rendered from {{script}}).
#   * assertion : `contains` the script's own "healthy" stdout marker.
#                 A non-zero exit code is already a provider `error`, so the
#                 case fails even without an explicit exit-code assertion.
#
# Hold boundary: this suite only *runs* the existing read-only gate scripts.
# It does not edit config/fastdds.xml, docs/artifacts/bench/SCOREBOARD.md,
# any vendor tree, or dimos_bridge runtime code.

description: >
  《5》Promptfoo seed evals for ros2_hzj gate scripts. Each case runs one
  scripts/*.py as a local-script provider and asserts its stdout marker.

prompts:
  - '{{script}}'

providers:
  # Path is resolved relative to this config file's directory (evals/).
  - id: './localScriptProvider.mjs'

tests:
  - description: 'prove_rmw.py: env/string identity gate exits 0 with ROS unset'
    vars:
      script: scripts/prove_rmw.py
    assert:
      - type: contains
        value: 'ROS not loaded'

  - description: 'check_source_map.py: source map healthy; allowlisted DDS/RMW symbols must still resolve in vendor sources'
    vars:
      script: scripts/check_source_map.py
    assert:
      - type: contains
        value: 'Source map healthy'
      - type: contains
        # Locks the symbol allowlist check (rmw_publish/take, dds_take, WaitSet,
        # ...): a vendor rewrite/drop that removes a traced API fails the eval.
        value: 'allowlisted symbols ok:'

  - description: 'print_bench_gates.py: bench gates healthy; cross-host blocked, no fabricated latency numbers / P99 summing'
    vars:
      script: scripts/print_bench_gates.py
    assert:
      - type: contains
        value: 'Bench gates healthy'
      - type: contains
        # Cross-host latency is blocked on this host; must not be flipped to a pass.
        value: 'cross-host: blocked'
      - type: contains
        # Methodology honesty: segment P99s must never be summed into a chain P99.
        value: 'Do not sum segment P99s'

  - description: 'check_risk_matrix.py: risk matrix healthy; §9.4 layer order, no invented risk scores, cross-host blocked'
    vars:
      script: scripts/check_risk_matrix.py
    assert:
      - type: contains
        value: 'Risk matrix healthy'
      - type: contains
        # §9.4 layer checklist anchor: env/XML is the first layer.
        value: '§9.4: env/XML first'
      - type: contains
        # Honesty: this record carries no made-up risk percentages.
        value: 'Do not invent risk percentages'
      - type: contains
        # Cross-host evidence stays blocked (single-line phrase).
        value: 'Cross-host stays blocked'

  - description: 'check_executor_map.py: executor WaitSet->callback map healthy'
    vars:
      script: scripts/check_executor_map.py
    assert:
      - type: contains
        value: 'Executor map healthy'
      - type: contains
        value: 'WaitSet -> callback: mapped'

  - description: 'check_runtime_provenance.py: underlay vs vendor snapshot healthy'
    vars:
      script: scripts/check_runtime_provenance.py
    assert:
      - type: contains
        value: 'Runtime provenance healthy'
      - type: contains
        value: 'underlay != vendor snapshot'

  - description: 'check_unitree_cyclone_swap.py: Unitree 0.10.2 vs vendor 11.0.1 record healthy; drop-in FAIL / wire UNPROVEN verdict must not be silently flipped'
    vars:
      script: scripts/check_unitree_cyclone_swap.py
    assert:
      - type: contains
        value: 'Unitree Cyclone swap record healthy'
      - type: contains
        value: 'drop-in: FAIL / wire: UNPROVEN'

  - description: 'check_three_chain_repro.py: three-chain map != reproduce, STATUS blocked (must not fabricate a reproduce PASS without a Humble host)'
    vars:
      script: scripts/check_three_chain_repro.py
    assert:
      - type: contains
        value: 'Three-chain reproduce record healthy'
      - type: contains
        value: 'map ≠ reproduce'
      - type: contains
        value: 'STATUS: blocked'

  - description: 'check_sink_layers.py: sink layers mapped Hold vs allowed'
    vars:
      script: scripts/check_sink_layers.py
    assert:
      - type: contains
        value: 'Sink-layer record healthy'
      - type: contains
        value: 'sink layers: mapped (Hold vs allowed)'

  - description: 'check_dual_chain_baseline.py: dual-chain baseline pointer-only, no XML rewrite; same-topology XML tuning paused'
    vars:
      script: scripts/check_dual_chain_baseline.py
    assert:
      - type: contains
        value: 'Dual-chain baseline healthy'
      - type: contains
        value: 'dual-chain baseline: pointer only (no XML rewrite)'
      - type: contains
        value: 'same-topology XML tuning is paused'

  - description: 'check_dual_chain_baseline.py: load.py is single source of truth, cross-checks shell copies + wrapper'
    vars:
      script: scripts/check_dual_chain_baseline.py
    assert:
      - type: contains
        # One line encodes the real chain values: A=rmw_fastrtps_cpp/42 +
        # fastdds.xml, B=rmw_cyclonedds_cpp/0, CYCLONEDDS_URI in CHAIN_B_UNSET.
        value: 'ok env truth:'
      - type: contains
        value: 'rmw_fastrtps_cpp/42'
      - type: contains
        value: 'rmw_cyclonedds_cpp/0'
      - type: contains
        value: 'CYCLONEDDS_URI in CHAIN_B_UNSET'
      - type: contains
        value: 'chain_a.sh exports match load.py CHAIN_A'
      - type: contains
        value: 'chain_b.sh exports match load.py CHAIN_B'
      - type: contains
        value: 'dual_chain_env.py re-exports match load.py'
      - type: contains
        value: 'import leaves os.environ unchanged'

  - description: 'check_dod_evidence.py: product DoD unmet, STATUS blocked (must not claim the product DoD is met)'
    vars:
      script: scripts/check_dod_evidence.py
    assert:
      - type: contains
        value: 'Product DoD evidence healthy'
      - type: contains
        value: 'DoD: unmet'

  - description: 'check_cega_bridge_hold.py: Cega / Bridge Hold (no Cega integration, no runtime edits)'
    vars:
      script: scripts/check_cega_bridge_hold.py
    assert:
      - type: contains
        value: 'Cega / Bridge Hold healthy'
      - type: contains
        value: 'no Cega'

  - description: 'check_frozen_path_literals.py: no second Path(...) copy of frozen Hold paths'
    vars:
      script: scripts/check_frozen_path_literals.py
    assert:
      - type: contains
        value: 'Frozen-path literals healthy'

  # Direct executable source of truth for the dual-chain contract. These two
  # cases pass CLI args through the local-script provider (argv split).
  - description: 'load.py print-a: Chain A is rmw_fastrtps_cpp / ROS_DOMAIN_ID 42 / config/fastdds.xml'
    vars:
      script: config/env/load.py print-a
    assert:
      - type: contains
        value: 'RMW_IMPLEMENTATION=rmw_fastrtps_cpp'
      - type: contains
        value: 'ROS_DOMAIN_ID=42'
      - type: contains
        value: 'config/fastdds.xml'

  - description: 'load.py print-b: Chain B is rmw_cyclonedds_cpp / ROS_DOMAIN_ID 0'
    vars:
      script: config/env/load.py print-b
    assert:
      - type: contains
        value: 'RMW_IMPLEMENTATION=rmw_cyclonedds_cpp'
      - type: contains
        value: 'ROS_DOMAIN_ID=0'

  # Full-stdout fingerprint regression (eval-only, not a CI gate): re-runs all
  # 13 gates + load.py print-a|b and compares normalized stdout byte-for-byte
  # against committed evals/fixtures/. Catches unintended output drift that
  # exit-code + single-marker checks cannot see. Regenerate reviewed changes
  # with `python3 evals/fingerprint_check.py --update`.
  - description: 'fingerprint_check.py: every gate/load.py stdout matches the committed, normalized baseline'
    vars:
      script: evals/fingerprint_check.py
    assert:
      - type: contains
        value: 'stdout fingerprint: stable'
      - type: contains
        # Locks the covered command count so dropping a command fails the eval.
        value: '**commands:** 15'
