name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required R0 paths exist
        run: |
          set -euo pipefail
          test -f docs/architecture/ros2-dds-r0-interface-freeze.md
          test -f docs/architecture/nitros-vs-dual-chain.md
          test -f docs/architecture/cn-jp-ros2-absorb.md
          test -f docs/architecture/feishu-middleware-adr.md
          test -f docs/architecture/ros2-source-map.md
          test -f docs/architecture/ci-cd-gates.md
          test -f docs/architecture/latency-attribution.md
          test -f docs/architecture/feishu-risk-matrix.md
          test -f docs/architecture/feishu-executor-waitset.md
          test -f vendor/MANIFEST.md
          test -f scripts/prove_rmw.py
          test -f scripts/check_source_map.py
          test -f scripts/print_bench_gates.py
          test -f scripts/check_risk_matrix.py
          test -f scripts/check_executor_map.py
          test -f docs/usage/transports/dds.md
          test -f docs/usage/transports/index.md
          test -f README.md
          test -f AGENTS.md
          test -f LICENSE

      - name: Vendor and DimOS dump paths exist
        run: |
          set -euo pipefail
          # Plain copies only — fail if a vendor tree is missing or still a gitlink.
          for tree in vendor/rmw vendor/rmw_fastrtps vendor/rmw_implementation \
                      vendor/rmw_cyclonedds vendor/Fast-DDS vendor/CycloneDDS; do
            test -d "$tree"
            test ! -e "$tree/.git"
          done
          test -f vendor/rmw/rmw/package.xml
          test -f vendor/rmw_fastrtps/rmw_fastrtps_cpp/package.xml
          test -f vendor/Fast-DDS/CMakeLists.txt
          test -f vendor/Fast-DDS/package.xml
          test -f vendor/rmw_cyclonedds/rmw_cyclonedds_cpp/package.xml
          test -f vendor/CycloneDDS/CMakeLists.txt
          test -f vendor/CycloneDDS/package.xml
          test ! -f .gitmodules
          test -f vendor/VERSIONS.md
          test -f vendor/MANIFEST.md
          test -d dimos_bridge/dimos/protocol/pubsub/impl
          test -f dimos_bridge/dimos/protocol/pubsub/impl/ddspubsub.py
          test -f dimos_bridge/dimos/protocol/pubsub/impl/rospubsub.py
          test -f dimos_bridge/dimos/protocol/service/ddsservice.py
          test -f dimos_bridge/dimos/core/transport.py
          test -f config/fastdds.xml
          test -f dimos_bridge/SOURCE.md
          # Do not build Fast-DDS or CycloneDDS in this job.

      - name: R1–R5 structural artifacts exist
        run: |
          set -euo pipefail
          test -f config/env/.env.example
          test -f config/env/chain_a.sh
          test -f config/env/chain_b.sh
          test -f config/env/load.py
          test -f config/env/README.md
          test -f dimos_bridge/dual_chain_env.py
          test -f config/fastdds.zh.md
          test -f config/topics.yaml
          test -f dimos_bridge/dimos/protocol/dds_topics.py
          test -f docker/ros/Dockerfile
          test -f docker/ros/install-base.sh
          test -f docker/ros/install-runtime.sh
          test -f docker/ros/NOTES.md
          test -f docs/usage/benchmark-dds.md
          test -f scripts/bench/README.md
          test -f scripts/bench/run_chain_b.sh
          test -f scripts/bench/run_chain_a.sh
          test -f scripts/bench/pingpong.py
          test -f scripts/bench/docker_chain_a.sh
          test -f scripts/bench/run_large_packet.sh
          test -f scripts/bench/run_imu_hf.sh
          test -f scripts/bench/run_cross_host_a.sh
          test -f scripts/bench/write_delta.py
          test -f docs/artifacts/bench/README.md
          # Durable index only — do not fossilize every iter changelog file.
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          readme = Path("docs/artifacts/bench/README.md")
          text = readme.read_text(encoding="utf-8")
          dirs = re.findall(r"\[`([^`]+/)`\]\([^)]+\)", text)
          if not dirs:
              sys.exit("bench README lists no date dirs")
          missing = [d for d in dirs if not (readme.parent / d).is_dir()]
          if missing:
              sys.exit("bench README lists missing dirs: " + ", ".join(missing))
          print(f"bench README lists {len(dirs)} date dirs")
          PY
          grep -q 'domainId>42' config/fastdds.xml
          grep -q 'rmw_fastrtps_cpp' config/env/chain_a.sh
          grep -q 'ROS_DOMAIN_ID=42' config/env/chain_a.sh
          grep -q 'rmw_cyclonedds_cpp' config/env/chain_b.sh
          grep -q 'ROS_DOMAIN_ID=0' config/env/chain_b.sh

      - name: check_source_map.py (wiki3 §13.2)
        run: |
          set -euo pipefail
          python3 scripts/check_source_map.py
          # Paths + allowlisted symbols only. Do not compile vendor.

      - name: print_bench_gates.py (wiki3 §12 / §13.3)
        run: |
          set -euo pipefail
          python3 scripts/print_bench_gates.py
          python3 scripts/print_bench_gates.py | grep -F 'cross-host: blocked'
          # Pointers + STATUS markers only. Do not invent percentiles.

      - name: check_risk_matrix.py (wiki3 §9.4)
        run: |
          set -euo pipefail
          python3 scripts/check_risk_matrix.py
          python3 scripts/check_risk_matrix.py | grep -F '§9.4: env/XML first'
          # Docs + Hold markers only. Do not invent risk scores or percentiles.

      - name: check_executor_map.py (wiki3 §13 wait→callback)
        run: |
          set -euo pipefail
          python3 scripts/check_executor_map.py
          python3 scripts/check_executor_map.py | grep -F 'WaitSet -> callback: mapped'
          # Paths + WaitSet/wait/take symbols only. Do not compile vendor.

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Env helpers print contract (no silent apply)
        run: |
          set -euo pipefail
          unset RMW_IMPLEMENTATION ROS_DOMAIN_ID FASTRTPS_DEFAULT_PROFILES_FILE
          python3 config/env/load.py print-a | grep -F 'RMW_IMPLEMENTATION=rmw_fastrtps_cpp'
          python3 config/env/load.py print-a | grep -F 'ROS_DOMAIN_ID=42'
          python3 config/env/load.py print-a | grep -F 'FASTRTPS_DEFAULT_PROFILES_FILE='
          python3 config/env/load.py print-b | grep -F 'RMW_IMPLEMENTATION=rmw_cyclonedds_cpp'
          python3 config/env/load.py print-b | grep -F 'ROS_DOMAIN_ID=0'
          # import must not write os.environ
          python3 - <<'PY'
          import os
          os.environ.pop("RMW_IMPLEMENTATION", None)
          os.environ.pop("ROS_DOMAIN_ID", None)
          import importlib.util
          spec = importlib.util.spec_from_file_location("load", "config/env/load.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert "RMW_IMPLEMENTATION" not in os.environ
          assert "ROS_DOMAIN_ID" not in os.environ
          print("import-safe: env unchanged")
          PY
          python3 - <<'PY'
          from dimos_bridge.dimos.protocol.dds_topics import (
              CHAIN_A_ROS_DOMAIN_ID,
              CHAIN_B_CYCLONE_DOMAIN_ID,
              TOPIC_CMD_VEL,
              TOPIC_FOXGLOVE_TELEOP,
              TOPIC_GOAL_POSE,
              TOPIC_JOY,
              TOPIC_WAY_POINT,
              GO2_LIDAR,
          )
          assert CHAIN_A_ROS_DOMAIN_ID == 42
          assert CHAIN_B_CYCLONE_DOMAIN_ID == 0
          assert TOPIC_FOXGLOVE_TELEOP == "/foxglove_teleop"
          assert TOPIC_CMD_VEL == "/cmd_vel"
          assert TOPIC_GOAL_POSE == "/goal_pose"
          assert TOPIC_WAY_POINT == "/way_point"
          assert TOPIC_JOY == "/joy"
          assert GO2_LIDAR == "lidar"
          print("dds_topics constants ok")
          PY

      - name: In-repo markdown relative links
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".").resolve()
          files = [
              Path("README.md"),
              Path("AGENTS.md"),
              Path("docs/architecture/ros2-dds-r0-interface-freeze.md"),
              Path("docs/architecture/nitros-vs-dual-chain.md"),
              Path("docs/architecture/cn-jp-ros2-absorb.md"),
              Path("docs/architecture/feishu-middleware-adr.md"),
              Path("docs/architecture/ros2-source-map.md"),
              Path("docs/architecture/ci-cd-gates.md"),
              Path("docs/architecture/latency-attribution.md"),
              Path("docs/architecture/feishu-risk-matrix.md"),
              Path("docs/architecture/feishu-executor-waitset.md"),
              Path("vendor/MANIFEST.md"),
              Path("docs/usage/transports/dds.md"),
              Path("docs/usage/transports/index.md"),
              Path("docs/usage/benchmark-dds.md"),
              Path("scripts/bench/README.md"),
              Path("docs/artifacts/bench/README.md"),
              Path("vendor/VERSIONS.md"),
              Path("vendor/README.md"),
              Path("dimos_bridge/SOURCE.md"),
              Path("config/env/README.md"),
              Path("config/fastdds.zh.md"),
              Path("docker/ros/NOTES.md"),
          ]
          link_re = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          missing = []
          checked = 0
          for path in files:
              text = path.read_text(encoding="utf-8")
              for raw in link_re.findall(text):
                  target = raw.split("#", 1)[0].strip()
                  if not target:
                      continue
                  if target.startswith(("http://", "https://", "mailto:")):
                      continue
                  if target.startswith("<"):
                      continue
                  # DimOS site-root, runtime, and figure paths are not in this repo.
                  if target.startswith("/") or "dimos/" in target:
                      continue
                  if "/assets/" in f"/{target}" or target.startswith("assets/"):
                      continue
                  dest = (path.parent / target).resolve()
                  checked += 1
                  if not dest.exists():
                      missing.append(f"{path}: {target}")

          print(f"checked {checked} in-repo relative links")
          if missing:
              print("missing:")
              for item in missing:
                  print(f"  {item}")
              sys.exit(1)
          PY

      - name: prove_rmw.py runs without ROS
        run: |
          set -euo pipefail
          unset ROS_DISTRO RMW_IMPLEMENTATION ROS_DOMAIN_ID \
            FASTRTPS_DEFAULT_PROFILES_FILE CYCLONEDDS_URI AMENT_PREFIX_PATH || true
          python3 scripts/prove_rmw.py
          python3 scripts/prove_rmw.py | grep -F 'ROS not loaded'
          # Do not compile vendor.

  boundary:
    name: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD plus the PR base SHA (fetched below) is enough for a tree diff.
          fetch-depth: 1

      - name: Fetch PR base for diff
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Hold boundary guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
          HAS_BYPASS: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'allow-hold-bypass') }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          import subprocess
          import sys

          event = os.environ.get("EVENT_NAME", "")
          has_bypass = os.environ.get("HAS_BYPASS", "false").lower() == "true"
          base = os.environ.get("BASE_SHA", "")
          head = os.environ.get("HEAD_SHA", "")

          frozen = {
              "config/fastdds.xml",
              "docs/artifacts/bench/SCOREBOARD.md",
          }
          intro_re = re.compile(
              r"(^|/)([^/]*(agnocast|zenoh)[^/]*)(/|$)",
              re.IGNORECASE,
          )

          def paths_from_diff(a: str, b: str) -> list[str]:
              out = subprocess.check_output(
                  ["git", "diff", "--name-status", "--find-renames", a, b],
                  text=True,
              )
              found: list[str] = []
              for line in out.splitlines():
                  parts = line.split("\t")
                  if len(parts) < 2:
                      continue
                  found.extend(p for p in parts[1:] if p)
              return found

          def violations_for(paths: list[str]) -> list[str]:
              hits: list[str] = []
              for path in paths:
                  if path in frozen:
                      hits.append(f"{path} (Hold-frozen file)")
                  elif intro_re.search(path):
                      hits.append(f"{path} (Hold: Agnocast/zenoh path)")
              return hits

          if event != "pull_request":
              print(
                  "push/main: Hold boundary is warn-only "
                  "(already-merged history must not fail CI)"
              )
              sys.exit(0)

          if has_bypass:
              print("label allow-hold-bypass present: skipping fail")
              if base and head:
                  paths = paths_from_diff(base, head)
                  hits = violations_for(paths)
                  if hits:
                      print("would have flagged:")
                      for item in hits:
                          print(f"  - {item}")
              sys.exit(0)

          if not base or not head:
              sys.exit("BASE_SHA/HEAD_SHA missing on pull_request")

          paths = paths_from_diff(base, head)
          print(f"PR diff {base[:12]}..{head[:12]}: {len(paths)} path(s)")
          hits = violations_for(paths)
          if hits:
              print("Hold boundary violated:")
              for item in hits:
                  print(f"  - {item}")
              print(
                  "Do not edit fastdds.xml / SCOREBOARD or introduce "
                  "Agnocast/zenoh paths. Rare override: label allow-hold-bypass."
              )
              sys.exit(1)
          print("Hold boundary: no frozen or Agnocast/zenoh paths in PR diff")
          PY
