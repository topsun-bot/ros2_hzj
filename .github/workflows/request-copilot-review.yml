name: request-copilot-review

# Optional belt: ruleset copilot-auto-review (id 22999465) already reviews on push.
# Not a required check. Warn-not-fail if GITHUB_TOKEN cannot request the bot.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  request:
    name: request-copilot-review
    runs-on: ubuntu-latest
    steps:
      - name: Request copilot-pull-request-reviewer[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'; then
            echo "Requested copilot-pull-request-reviewer[bot]"
          else
            echo "::warning::GITHUB_TOKEN could not request copilot-pull-request-reviewer[bot]. Ruleset copilot-auto-review (id 22999465) still reviews on push. This job is warn-not-fail and is not a required check."
          fi
