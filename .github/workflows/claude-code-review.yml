name: claude-code-review

# Automated Claude code review on every pull request.
#
# Advisory only: this workflow posts review comments, it is NOT a required
# status check. Hold gates (structure / contracts / boundary) stay in ci.yml.
#
# Setup (one-time, repo Settings -> Secrets and variables -> Actions):
#   ANTHROPIC_API_KEY  - Anthropic API key used by anthropics/claude-code-action
#
# Supply chain / permissions (see docs/security/2026-09-vendor-cve-audit.md §2.2):
#   - the action is pinned to a release commit SHA, not a mutable tag;
#   - it authenticates to GitHub with the job's own short-lived GITHUB_TOKEN
#     (no id-token / OIDC exchange, no GitHub App);
#   - Claude has read-only repository access (Read/Glob/Grep/LS, gh pr
#     view/diff) plus comment-writing access (the action's tracking comment
#     and inline review comments). No shell access to git or python: no
#     `git diff --no-index` / `--output` file-read primitive, no `gh pr
#     comment --body-file` upload path, no file edits or commits.
#   - No GitHub token is written into the checkout: actions/checkout runs
#     with persist-credentials: false and use_commit_signing: true makes the
#     action skip its git-credential setup (which would otherwise embed the
#     token in the origin URL). The repository is public, so the action's
#     own `git fetch` of the PR branch works anonymously.
#   - Residual risk, inherent to any tool-using reviewer: the process env
#     holds ANTHROPIC_API_KEY and the job GITHUB_TOKEN, and a file-reading
#     tool plus a comment tool is a text channel. Mitigations: minimal,
#     short-lived GITHUB_TOKEN scopes; fork PRs receive no secrets; use a
#     dedicated, spend-capped Anthropic workspace key for this secret.
#
# Docs: https://github.com/anthropics/claude-code-action

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write # inline review comments
  issues: write        # sticky summary comment (PR comments are issue comments)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    # Skip drafts; they are reviewed once marked ready_for_review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v4.4.0 commit; persist-credentials: false keeps the job
      # token out of .git/config in the workspace Claude reads.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # Pinned to the v1.0.99 release commit. Bump deliberately, never to a tag.
      - uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          # Tag mode with a tracking comment: the summary is written through the
          # action's own comment tool, so no `gh pr comment` shell access is needed.
          track_progress: true
          # API commit signing path: the action then skips configureGitAuth, so
          # the token is never embedded in the origin URL. This job never
          # commits anyway (contents: read, file tools disallowed below).
          use_commit_signing: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request in ros2_hzj, TOPSUN / 桦之坚's
            ROS 2 / DDS dual-chain workspace. Read AGENTS.md first: it defines
            the Hold rules and the local gate commands.

            Review the PR diff (the PR branch is checked out in the working
            directory) with a focus on:
            - Correctness bugs and behavioral regressions in scripts/, evals/,
              config/ and dimos_bridge/.
            - Hold violations: edits to config/fastdds.xml or
              docs/artifacts/bench/SCOREBOARD.md, any Agnocast / zenoh
              introduction, changes to dimos_bridge DDS behavior or vendor
              sources, Cega integration or Bridge runtime rewrites.
            - Honesty of claims: docs or evals must not assert measured
              latency, PASS / PROVEN, or reproduced runs that the repo cannot
              back with evidence (STATUS: blocked / DoD: unmet stay honest).
            - Eval assertion quality: new selftests should fail on the
              mutation they claim to catch and must not be vacuously true.
            - Doc / code consistency: README, evals/README.md,
              promptfooconfig.yaml and ITERATION_LOG counts must match the
              code they describe.

            You have read-only repository access plus comment-writing access.
            Review by reading the checkout and the diff. You cannot and must
            not execute repository code or edit files.

            Write the review in the same language as the PR description
            (简体中文 when the description is Chinese). Be concise: list
            concrete findings with file paths and line references, state
            severity, and skip praise. If there are no findings, say so in
            one short comment.

            Put the summary in your tracking comment
            (`mcp__github_comment__update_claude_comment`).
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for line-specific issues.
            Only post GitHub comments - do not return the review as a plain
            message.
          claude_args: |
            --model claude-opus-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
