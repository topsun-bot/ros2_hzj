name: claude-code-review

# Claude as an automated PR reviewer (advisory; not a required status check).
# Runs the official `code-review` plugin skill via anthropics/claude-code-action
# and posts findings as inline PR comments (`--comment`), or one summary comment
# when it finds nothing. Draft PRs and fork PRs are skipped at the job level
# (GitHub withholds secrets from fork runs). If neither ANTHROPIC_API_KEY nor
# CLAUDE_CODE_OAUTH_TOKEN is configured, the job logs a notice and exits green
# instead of failing, so initial setup does not show as a red check.
#
# Setup (one-time, repo admin):
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Add repository secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN and
#      switch the `anthropic_api_key` line below to `claude_code_oauth_token`).
# Docs: https://code.claude.com/docs/en/github-actions

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    # Skip drafts and fork PRs. Secret presence is checked in the first step:
    # the `secrets` context is not available in a job-level `if`.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check review credentials
        id: creds
        env:
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_API_KEY" = "true" ] || [ "$HAS_OAUTH_TOKEN" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=claude-code-review skipped::Add repository secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) to enable Claude PR review. See docs/architecture/ci-cd-gates.md §5.1."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.creds.outputs.configured == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Keep --allowedTools here: the action only starts the inline-comment
          # MCP server when this flag names it. The system-prompt append points
          # the reviewer at this repo's Hold rules (AGENTS.md / ci-cd-gates.md).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Read AGENTS.md first. Treat as Important any change to config/fastdds.xml or docs/artifacts/bench/SCOREBOARD.md, any path containing agnocast or zenoh, any edit to dimos_bridge DDS behavior or vendor/ sources, and any invented benchmark percentiles, PASS / PROVEN markers, or latency numbers. These are Hold boundaries, not style preferences."
