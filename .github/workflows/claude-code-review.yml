name: claude-code-review

# Advisory Claude code review on every pull request.
# Not a required status check: structure / contracts / boundary (ci.yml) stay
# the merge gates. See docs/architecture/ci-cd-gates.md §1.1.
# Needs repository secret ANTHROPIC_API_KEY and the Claude GitHub App installed.

on:
  pull_request:
    # converted_to_draft only re-enters the concurrency group so the in-flight
    # review of a PR that just went back to draft is cancelled; the job itself
    # is skipped by the draft check below.
    types: [opened, synchronize, ready_for_review, reopened, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-code-review
    runs-on: ubuntu-latest
    # Skip drafts. Skip fork PRs: GitHub withholds repository secrets from
    # `pull_request` runs of forks, so the job could only fail there.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Review only. This run is unattended: a tool call that is not
          # pre-approved (by --allowedTools here or by the code-review skill's
          # own allowed-tools list) has nobody to answer its prompt and is
          # denied. --allowedTools pre-approves only the tool that posts inline
          # PR comments. --disallowedTools removes file-editing and web tools
          # outright and denies git push / commit, gh pr merge / close, and
          # curl / wget / rm even if a skill were to allow them. Deny rules win
          # over allow rules. Bash is not removed wholesale because the review
          # skill reads the PR through its own pre-approved read-only commands.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch,Bash(git push *),Bash(git commit *),Bash(gh pr merge *),Bash(gh pr close *),Bash(curl *),Bash(wget *),Bash(rm *)"
