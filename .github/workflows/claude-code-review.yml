name: claude-code-review

# Advisory Claude code review on every PR. Not a required status check:
# the Hold gates (structure / contracts / boundary in ci.yml) stay the
# merge blockers, and a human still approves the merge.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-code-review
    # Skip drafts and skip bot-authored PRs (dependabot etc.) to save budget.
    if: >-
      github.event.pull_request.draft == false &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request in ros2_hzj, a ROS 2 / DDS
            dual-chain evidence workspace. Read AGENTS.md and
            docs/architecture/ci-cd-gates.md first: they define the Hold
            boundary this repo enforces.

            Review the PR diff (the PR branch is already checked out) for:
            - Correctness bugs in Python gate scripts, eval self-tests,
              shell wrappers, and CI YAML.
            - Hold boundary violations: edits to config/fastdds.xml or
              docs/artifacts/bench/SCOREBOARD.md, new Agnocast / zenoh
              paths, changes to dimos_bridge DDS behavior or vendor/ sources,
              Cega integration or Bridge runtime rewrites.
            - Honesty markers: invented benchmark percentiles, STATUS: PASS
              or DoD: met claims, or "reproduced on this host" claims where
              the docs say STATUS: blocked.
            - Docs drifting from code: README / evals/README.md tables,
              promptfoo case counts, gate registries, relative links.

            Post concise, actionable findings. Prefer inline comments on the
            exact lines. Do not restate the PR description, do not praise,
            and do not comment on style unless it hides a bug. If you find
            nothing worth changing, say so in one line.

            Use `gh pr comment` for the top-level summary.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for line-specific issues.
            Only post GitHub comments - do not approve, request changes,
            merge, push commits, or edit files.
          claude_args: |
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
