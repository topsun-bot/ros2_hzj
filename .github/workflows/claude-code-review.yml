name: claude-code-review

# Advisory AI review on same-repo, non-draft PRs. Not a required status
# check: structure / contracts / boundary in ci.yml stay the merge gate, and
# a human still approves the merge (ci-cd-gates.md §5).
#
# Trust model: `pull_request` runs the workflow from the PR merge ref, so
# only people who already have push access (and could edit main's workflows
# anyway) can change it. Fork PRs get no secrets and a read-only token, so
# they are skipped explicitly below instead of failing on a missing key.
# `pull_request_target` is deliberately NOT used: it would run a write token
# against untrusted checkout content.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The model reads this checkout; keep GITHUB_TOKEN out of .git/config.
          # The action authenticates its own gh / GitHub API calls.
          persist-credentials: false

      - name: Claude Code review
        # TODO(maintainer): pin to an immutable commit SHA of the v1 release
        # (`git ls-remote https://github.com/anthropics/claude-code-action v1`)
        # and let Dependabot bump it. This action receives ANTHROPIC_API_KEY
        # and PR write permissions; a mutable tag can change privileged code
        # without a reviewed change here.
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request in `ros2_hzj`, a ROS 2 / DDS
            dual-chain workspace. Read `AGENTS.md` and
            `docs/architecture/ci-cd-gates.md` first, then `gh pr diff`.

            Review for, in this order:
            1. Hold boundary violations (block-level findings):
               - edits to `config/fastdds.xml` or `docs/artifacts/bench/SCOREBOARD.md`
               - any path introducing Agnocast / zenoh (`rmw_zenoh`, kmod, heaphook)
               - changes to `dimos_bridge` DDS behavior or `vendor/` sources
               - Cega integration or Bridge runtime rewrites
            2. Honesty: invented percentiles / P99 numbers, `PASS` or `PROVEN`
               where the repo says `STATUS: blocked` / `DoD: unmet`, or summed
               segment P99s presented as a chain P99.
            3. Gate contract drift: a `scripts/check_*.py` / `prove_rmw.py`
               stdout marker that ci.yml or `evals/` greps for was changed
               or removed without updating both.
            4. Ordinary correctness bugs in Python / shell / YAML / docs links.

            Do not review style or formatting. Do not ask for tests that need a
            ROS Humble runtime (this host has none; that is `STATUS: blocked`).
            Docs *mentioning* Agnocast / zenoh are fine; only new *paths* count.

            Use `mcp__github_inline_comment__create_inline_comment` for
            line-specific findings and `gh pr comment` for one short summary.
            If there are no findings, post a single short comment saying so.
            Never approve, request changes, or merge.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
