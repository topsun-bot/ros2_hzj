name: claude-code-review

# Advisory AI review on same-repo, non-draft PRs. Not a required status
# check: structure / contracts / boundary in ci.yml stay the merge gate, and
# a human still approves the merge (ci-cd-gates.md §5).
#
# Trust model: `pull_request` runs the workflow from the PR merge ref, so
# only people who already have push access (and could edit main's workflows
# anyway) can change it. Fork PRs get no secrets and a read-only token, so
# they are skipped explicitly below instead of failing on a missing key.
# `pull_request_target` is deliberately NOT used: it would run a write token
# against untrusted checkout content.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The model reads this checkout; keep GITHUB_TOKEN out of .git/config.
          # The action authenticates its own gh / GitHub API calls.
          persist-credentials: false

      # Trusted step: materialize the PR diff as a file inside the workspace so
      # the model needs no shell at all. The model never gets Bash, so a
      # prompt injection in PR content has no `gh ... --body-file` / `$(...)`
      # path to publish credentials.
      - name: Write PR diff for the reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p .pr-review
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > .pr-review/pr.diff
          wc -l .pr-review/pr.diff

      - name: Claude Code review
        # TODO(maintainer): pin to an immutable commit SHA of the v1 release
        # (`git ls-remote https://github.com/anthropics/claude-code-action v1`)
        # and let Dependabot bump it. This action receives ANTHROPIC_API_KEY
        # and PR write permissions; a mutable tag can change privileged code
        # without a reviewed change here. Pin actions/checkout above in the
        # same change (ci.yml uses the same @v4 tag today; keep them aligned).
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Tracking comment on the PR; the model updates it via a text-only MCP
          # tool instead of running `gh pr comment`.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request in `ros2_hzj`, a ROS 2 / DDS
            dual-chain workspace. Read `AGENTS.md` and
            `docs/architecture/ci-cd-gates.md` first, then the PR diff at
            `.pr-review/pr.diff` (pre-generated; you have no shell, no Grep,
            no Glob: open files by path with Read).

            Review for, in this order:
            1. Hold boundary violations (block-level findings):
               - edits to `config/fastdds.xml` or `docs/artifacts/bench/SCOREBOARD.md`
               - any path introducing Agnocast / zenoh (`rmw_zenoh`, kmod, heaphook)
               - changes to `dimos_bridge` DDS behavior or `vendor/` sources
               - Cega integration or Bridge runtime rewrites
            2. Honesty: invented percentiles / P99 numbers, `PASS` or `PROVEN`
               where the repo says `STATUS: blocked` / `DoD: unmet`, or summed
               segment P99s presented as a chain P99.
            3. Gate contract drift: a `scripts/check_*.py` / `prove_rmw.py`
               stdout marker that ci.yml or `evals/` greps for was changed
               or removed without updating both.
            4. Ordinary correctness bugs in Python / shell / YAML / docs links.

            Do not review style or formatting. Do not ask for tests that need a
            ROS Humble runtime (this host has none; that is `STATUS: blocked`).
            Docs *mentioning* Agnocast / zenoh are fine; only new *paths* count.

            Use `mcp__github_inline_comment__create_inline_comment` for
            line-specific findings and `mcp__github_comment__update_claude_comment`
            to write one short summary into the tracking comment. If there are
            no findings, say so in the tracking comment.
            Never approve, request changes, or merge. Never quote environment
            variables, tokens, or anything outside the repository checkout.
          # Text-only publish channels (inline comment + tracking comment) and
          # Read as the ONLY file access. No Bash; Grep/Glob are denied too
          # because they take a path argument that the Read(...) deny rules
          # would not cover. Reads outside the checkout are denied so
          # /proc/self/environ, the runner temp dir (holds the action's MCP
          # config) and dotfiles cannot be echoed into a comment. Only the
          # dot-entries of $HOME are denied, not $HOME itself: on GitHub-hosted
          # runners the workspace lives under /home/runner/work, so a blanket
          # ~/** deny would also block AGENTS.md and .pr-review/pr.diff.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Read"
            --disallowedTools "Bash,Grep,Glob,Read(//proc/**),Read(//dev/**),Read(//sys/**),Read(//etc/**),Read(~/.*),Read(~/.*/**),Read(/${{ runner.temp }}/**)"
