name: claude-code-review

# Advisory Claude review on every non-draft pull request.
# Review-only: Claude posts comments; it never pushes commits or edits files.
# Not a required status check — `ci.yml` (structure / contracts / boundary) stays the gate.
# Needs repository secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: claude-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the code reviewer for this pull request. Read AGENTS.md and
            docs/architecture/ci-cd-gates.md first; they define the Hold boundary.

            Review the PR diff for:
            1. Hold violations — any edit to config/fastdds.xml or
               docs/artifacts/bench/SCOREBOARD.md; any path introducing Agnocast or
               zenoh; any change to dimos_bridge DDS runtime behaviour or vendor/ sources;
               any Cega integration or Bridge runtime rewrite.
            2. Honesty markers — invented percentiles, PASS / PROVEN claims, or removed
               `STATUS: blocked` / `DoD: unmet` / Hold markers that the check_*.py gates
               rely on.
            3. Correctness bugs, broken in-repo relative links, and CI breakage in
               scripts/, config/env/, dimos_bridge/, and .github/workflows/.
            4. Docs that drift from the code they describe.

            Rules:
            - Review only. Do not create commits, push, edit files, or add labels.
            - Use `gh pr comment` for the summary and inline comments for specific lines.
            - Be concise. Flag blocking issues first, then optional nits marked (optional).
            - If there is nothing to flag, say so in one short comment.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
            --max-turns 30
