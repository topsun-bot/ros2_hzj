name: claude-code-review

# Advisory AI code review by Claude Code on every non-draft pull request
# from a branch in this repository. Not a required status check: the Hold
# gates (structure / contracts / boundary) in ci.yml stay the merge bar.
#
# Prerequisite: repository secret ANTHROPIC_API_KEY (Claude Console API key).
# Fork PRs are skipped because GitHub withholds secrets from fork runs.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated code reviewer for this pull request.
            Read AGENTS.md and docs/architecture/ci-cd-gates.md first: they
            define the Hold boundary for this repository.

            Review the PR diff for:
            1. Correctness bugs, broken invariants, and unhandled edge cases
               in Python scripts, shell wrappers, evals, and configuration.
            2. Hold-boundary violations: edits to config/fastdds.xml or
               docs/artifacts/bench/SCOREBOARD.md, any path introducing
               Agnocast or zenoh, changes to dimos_bridge DDS behavior or
               vendor sources, Cega integration, or Bridge runtime rewrites.
            3. Contract drift: domain 42 for chain A, domain 0 for chain B,
               `config/env/load.py` must not write os.environ on import,
               `scripts/prove_rmw.py` must exit 0 without ROS.
            4. Documentation accuracy: broken relative links, claims of
               measured latency, PASS, or PROVEN results that the repo marks
               as blocked or unmet, and numbers not backed by evidence.
            5. Tests and self-tests: whether a code change adjusts or adds
               the matching gate / selftest coverage.

            Rules:
            - Do not modify files, push commits, or create branches.
            - Post specific issues as inline comments on the exact lines.
            - Post one summary comment: verdict (approve / needs changes),
              the findings ordered by severity, and what you checked.
            - Skip style nits unless they hide a real defect.
            - Write the review in the language the PR description uses
              (Chinese or English).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
