name: claude-code-review

# Advisory AI review on same-repo, non-draft PRs. Not a required status
# check: structure / contracts / boundary in ci.yml stay the merge gate, and
# a human still approves the merge (ci-cd-gates.md §5).
#
# Trust model: `pull_request` runs the workflow from the PR merge ref, so
# only people who already have push access (and could edit main's workflows
# anyway) can change it. Fork PRs get no secrets and a read-only token, so
# they are skipped explicitly below instead of failing on a missing key.
# `pull_request_target` is deliberately NOT used: it would run a write token
# against untrusted checkout content.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # TODO(maintainer): pin actions/checkout and anthropics/claude-code-action
      # below to immutable commit SHAs in one reviewed change and let Dependabot
      # bump them (ci.yml uses the same @v4 checkout tag today; keep aligned).
      # Both run in a job that holds ANTHROPIC_API_KEY and PR write permissions.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The model reads this checkout; keep GITHUB_TOKEN out of .git/config.
          # The action authenticates its own gh / GitHub API calls.
          persist-credentials: false

      # Trusted step, two jobs:
      # 1. Strip every symlink from the PR checkout (outside .git). Git lets a
      #    PR add a symlink to /proc/self/environ or the runner temp dir; the
      #    Read(...) deny rules match the spelled path, so a link inside the
      #    workspace would bypass them. With no links left, every readable
      #    path is a regular file under ~/work/<repo>/**.
      # 2. Materialize the PR diff as a file so the model needs no shell. The
      #    file goes in a fresh mktemp directory that is a SIBLING of the
      #    checkout (…/work/<repo>/claude-review.XXXXXX): a PR cannot
      #    pre-plant a file or symlink there, and it is not runner.temp (which
      #    the model is denied). The exact path is handed to the prompt.
      - name: Strip symlinks and stage PR diff outside the PR-controlled tree
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          links="$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type l -print | wc -l)"
          find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type l -exec rm -f -- {} +
          echo "removed $links symlink(s) from the checkout"
          test "$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type l -print | wc -l)" = 0
          dir="$(mktemp -d "${GITHUB_WORKSPACE}/../claude-review.XXXXXX")"
          dir="$(cd "$dir" && pwd -P)"
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > "$dir/pr.diff"
          wc -l "$dir/pr.diff"
          echo "path=$dir/pr.diff" >> "$GITHUB_OUTPUT"

      - name: Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Tracking comment on the PR; the model updates it via a text-only MCP
          # tool instead of running `gh pr comment`.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request in `ros2_hzj`, a ROS 2 / DDS
            dual-chain workspace. Read `AGENTS.md` and
            `docs/architecture/ci-cd-gates.md` in the checkout first, then the
            PR diff at `${{ steps.diff.outputs.path }}` (pre-generated; you have
            no shell, no Grep, no Glob: open files by path with Read).

            Review for, in this order:
            1. Hold boundary violations (block-level findings):
               - edits to `config/fastdds.xml` or `docs/artifacts/bench/SCOREBOARD.md`
               - any path introducing Agnocast / zenoh (`rmw_zenoh`, kmod, heaphook)
               - changes to `dimos_bridge` DDS behavior or `vendor/` sources
               - Cega integration or Bridge runtime rewrites
            2. Honesty: invented percentiles / P99 numbers, `PASS` or `PROVEN`
               where the repo says `STATUS: blocked` / `DoD: unmet`, or summed
               segment P99s presented as a chain P99.
            3. Gate contract drift: a `scripts/check_*.py` / `prove_rmw.py`
               stdout marker that ci.yml or `evals/` greps for was changed
               or removed without updating both.
            4. Ordinary correctness bugs in Python / shell / YAML / docs links.

            Do not review style or formatting. Do not ask for tests that need a
            ROS Humble runtime (this host has none; that is `STATUS: blocked`).
            Docs *mentioning* Agnocast / zenoh are fine; only new *paths* count.

            Use `mcp__github_inline_comment__create_inline_comment` for
            line-specific findings and `mcp__github_comment__update_claude_comment`
            to write one short summary into the tracking comment. If there are
            no findings, say so in the tracking comment.
            Never approve, request changes, or merge. Never quote environment
            variables, tokens, or anything outside the repository checkout.
          # Tool boundary, three layers:
          #  --tools "Read"      built-in tool SET is Read only (no Bash, Edit,
          #                      Write, Grep, Glob, WebFetch, Agent, …).
          #  --allowedTools      pre-approves the two text-only publish tools
          #                      (inline comment + tracking comment) and Read.
          #  --disallowedTools   belt-and-braces denies for the mutating /
          #                      shell / search tools, plus Read denies for
          #                      every known non-checkout location on a
          #                      GitHub-hosted ubuntu runner: system dirs,
          #                      $HOME dot-entries (gh hosts.yml, .claude,
          #                      .npmrc, …), the runner's own trees under
          #                      ~/work (_temp holds the action's MCP config;
          #                      _actions/_tool/_PipelineMapping are runner
          #                      internals) and ~/runners. What remains
          #                      readable is ~/work/<repo>/**: the checkout
          #                      (symlinks stripped above, so no link can
          #                      re-enter a denied path) and the diff
          #                      directory staged above. Only the
          #                      dot-entries of $HOME are denied, not $HOME
          #                      itself, because the workspace lives under it.
          # Folded scalar (>-) so the CLI receives one argument line.
          claude_args: >-
            --tools "Read"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Read"
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,Grep,Glob,WebFetch,WebSearch,Agent,Task,Read(//proc/**),Read(//dev/**),Read(//sys/**),Read(//etc/**),Read(//root/**),Read(//tmp/**),Read(//var/**),Read(//opt/**),Read(//usr/**),Read(//run/**),Read(//mnt/**),Read(//srv/**),Read(//snap/**),Read(//boot/**),Read(//bin/**),Read(//sbin/**),Read(//lib/**),Read(//lib64/**),Read(//media/**),Read(~/.*),Read(~/.*/**),Read(~/runners/**),Read(~/work/_temp/**),Read(~/work/_actions/**),Read(~/work/_tool/**),Read(~/work/_PipelineMapping/**),Read(/${{ runner.temp }}/**)"
