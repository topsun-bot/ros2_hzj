name: claude-code-review

# Claude as an automated PR reviewer (advisory; not a required status check).
# Runs beside the existing bot reviewers. It only posts comments and never
# pushes commits, so `contents` stays read-only. Requires the repository
# secret ANTHROPIC_API_KEY.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the code reviewer for this pull request. The PR branch is
            already checked out in the current working directory. Read AGENTS.md
            first: it lists the repository Hold rules and the gate scripts.

            Review the diff (`gh pr diff`) for:
            - Correctness bugs and regressions in changed code.
            - Hold violations: edits to config/fastdds.xml or
              docs/artifacts/bench/SCOREBOARD.md numbers, enabling Agnocast or
              zenoh, changes to dimos_bridge DDS behavior or vendor/ sources,
              Cega integration or Bridge runtime rewrites.
            - Honesty markers: new claims of PASS / PROVEN / measured latency
              where the repo documents `STATUS: blocked` or `DoD: unmet`.
            - Tests and gates: a new gate or selftest must actually fail on
              the regression it claims to catch (not assert only the healthy
              path); registrations in run_all_gates.GATES, promptfoo config
              and README counts must stay consistent.
            - Security and resource hygiene (temp files cleaned up, cwd
              restored, no secrets).

            Post findings as inline comments with
            `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`), one per concrete issue, with file and line.
            Post one short top-level summary with `gh pr comment`: verdict,
            then the findings ordered by severity. If there are no findings,
            say so in one line. Only post GitHub comments; do not submit
            review text as messages, and do not push commits.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
