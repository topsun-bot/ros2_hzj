name: Claude Code Review

# Automated Claude review on every non-draft pull request from a branch in
# this repository. Independent of ci.yml (structure / contracts / boundary):
# it posts review comments, it is not a merge gate, and it never edits files.
#
# Setup (one-time, repo admin):
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Add the repository secret ANTHROPIC_API_KEY (Claude Console API key).
#      To bill a Claude subscription instead, run `claude setup-token` and
#      replace the `anthropic_api_key` line below with
#      `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}`.
# Docs: https://code.claude.com/docs/en/github-actions

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets are withheld from fork PRs; drafts are skipped until ready.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment posts one inline comment per finding (or a single
          # summary comment when nothing is found); without it the review
          # only lands in the workflow log.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Required even though the skill declares the same tool: the action
          # only starts the inline-comment MCP server when it is named here.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
