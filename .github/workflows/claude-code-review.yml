name: claude-code-review

# Claude as an automated PR reviewer (advisory, not a required check).
# Docs: docs/architecture/ci-cd-gates.md §1.1. Required gates stay in ci.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-review
    # Secrets are not exposed to fork PRs; skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md and
            docs/architecture/ci-cd-gates.md first; they define the Hold
            boundary for this repo.

            Focus on:
            - Hold violations: edits to config/fastdds.xml or
              docs/artifacts/bench/SCOREBOARD.md; any path introducing
              Agnocast / zenoh; changes to dimos_bridge DDS behavior or
              vendor/ sources; Cega integration or Bridge runtime rewrites.
            - Honesty markers: invented latency numbers, percentiles,
              PASS / PROVEN claims, or "measured" results with no artifact.
              STATUS: blocked and DoD: unmet must not be silently flipped.
            - Dual-chain contract: Chain A rmw_fastrtps_cpp domain 42,
              Chain B rmw_cyclonedds_cpp domain 0; config/env/load.py must
              not write os.environ on import.
            - Correctness bugs and broken in-repo relative links in the
              scripts/ and docs/ changed by this PR.

            Keep it short. Use inline comments for specific lines and one
            summary comment. Do not approve or request changes; a human
            decides merge. Do not push commits.
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
